name: Notify root repository

# A merged pull request lands on develop as a push. The root repository
# (docker setup with this app as a submodule) then updates its pointer.
on:
  push:
    branches: [develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the root repository to update submodules
        env:
          # Fine-grained token with Contents: read and write on the root repository only
          TOKEN: ${{ secrets.ROOT_REPO_DISPATCH_TOKEN }}
          PAYLOAD: >-
            {"event_type": "app-develop-updated",
             "client_payload": {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rafal19987/hairdersser-docker-config-angular-nest/dispatches \
            -d "$PAYLOAD"
